name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: salp-linux-mobile-pc-v0.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "debug-${{ github.run_number }}"             app/build/outputs/apk/debug/app-debug.apk             --title "salp Linux Mobile PC Debug #${{ github.run_number }}"             --notes "Automatic debug build from commit ${{ github.sha }}"             --prerelease             --latest=false             --target "${{ github.sha }}"
